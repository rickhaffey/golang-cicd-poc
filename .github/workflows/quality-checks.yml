name: Quality Checks
# comment for non-impact change
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.6
      - name: install goimports
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
      - name: check goimports
        run: |
          if [ -n "$(goimports -l .)" ]; then
            echo "Go files are not formatted. Run 'goimports -w .' to fix them."
            exit 1
          fi

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: stable

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...
